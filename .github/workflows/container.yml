name: Build and publish container

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check shell scripts
        run: |
          sudo apt-get install -y shellcheck
          bash -n entrypoint.sh update_config.sh
          shellcheck entrypoint.sh update_config.sh

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Omit images so tags can be passed separately to Buildah.
          tags: |
            type=ref,event=tag
            type=sha,format=long
          sep-tags: " "
          flavor: |
            latest=${{ !github.event.release.prerelease }}

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@9dc2ade9b5db229966b5025ae266311e12f349c4 # v2
        with:
          image: ${{ github.repository }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          containerfiles: ./Containerfile
          oci: true

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        uses: redhat-actions/push-to-registry@5860fc963bf8f2b3221773a023141612f010c469 # v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io
